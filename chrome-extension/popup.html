<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 16px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .status-box {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .status-label { color: #888; }
    .status-value { color: #e0e0e0; font-weight: 500; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .dot.green { background: #4caf50; }
    .dot.red { background: #f44336; }
    .dot.yellow { background: #ff9800; }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary { background: #0f3460; color: white; }
    .btn-secondary { background: #16213e; color: #e0e0e0; }
    .btn:hover { opacity: 0.85; }
    .muted { color: #666; font-size: 11px; }
  </style>
</head>
<body>
  <h2>🔌 TikTok Automation Bridge</h2>
  
  <div class="status-box">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="status-value" id="status">
        <span class="dot red"></span>Checking...
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Device</span>
      <span class="status-value" id="device">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Profile</span>
      <span class="status-value" id="profile">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Polling</span>
      <span class="status-value" id="polling">—</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btnToggle">Start</button>
  <button class="btn btn-secondary" id="btnOptions">Settings</button>
  
  <p class="muted" id="deviceId"></p>

  <script src="popup.js"></script>
</body>
</html>
