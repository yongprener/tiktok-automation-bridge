<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TikTok Automation Bridge — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 { font-size: 22px; margin: 0 0 24px; }
    h2 { font-size: 16px; margin: 24px 0 8px; color: #aaa; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #888; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
    }
    .btn-primary { background: #0f3460; color: white; }
    .btn-secondary { background: #16213e; color: #e0e0e0; border: 1px solid #333; }
    .btn:hover { opacity: 0.85; }
    .info-box {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
      font-size: 13px;
    }
    .info-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .info-label { color: #888; }
    .muted { color: #666; font-size: 12px; }
    .success { color: #4caf50; }
    .error { color: #f44336; }
  </style>
</head>
<body>
  <h1>🔧 TikTok Automation Bridge</h1>
  
  <div class="info-box">
    <div class="info-row">
      <span class="info-label">Device ID</span>
      <span id="deviceId">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Chrome Profile</span>
      <span id="profile">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Status</span>
      <span id="status">—</span>
    </div>
  </div>

  <h2>Configuration</h2>
  
  <div class="field">
    <label for="deviceName">Device Name</label>
    <input type="text" id="deviceName" placeholder="e.g. laptop-rumah, pc-kantor" />
    <p class="muted">Give this device a name. Commands will target it by name.</p>
  </div>
  
  <div class="field">
    <label for="botToken">Telegram Bot Token</label>
    <input type="password" id="botToken" placeholder="123456789:ABCdef..." />
    <p class="muted">Bot token from @BotFather. Used to communicate with Hermes Agent.</p>
  </div>
  
  <div class="field">
    <button class="btn btn-primary" id="btnSave">Save</button>
    <button class="btn btn-secondary" id="btnTest">Test Connection</button>
  </div>
  
  <div id="result"></div>

  <script src="options.js"></script>
</body>
</html>
